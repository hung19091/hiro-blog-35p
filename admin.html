<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理系統 | DevLog</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0d1117',
                        darkCard: '#161b22',
                        darkBorder: '#30363d',
                        accent: '#238636',
                        accentHover: '#2ea043'
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white">

    <header class="border-b border-darkBorder bg-darkCard/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-tight text-white group">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-500 to-cyan-600 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-shield-halved text-sm"></i>
                </div>
                <span>DevLog <span class="text-xs px-2 py-0.5 rounded bg-emerald-900/60 text-emerald-400 border border-emerald-700/50">Admin</span></span>
            </a>
            <div id="user-nav-area" class="hidden items-center space-x-4">
                <span id="user-email" class="text-xs text-gray-400 font-mono"></span>
                <button id="logout-btn" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-800/50 rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>登出系統</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <!-- Login Card -->
        <div id="login-section" class="max-w-md mx-auto mt-16 bg-darkCard border border-darkBorder rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-emerald-600/20 border border-emerald-500/30 rounded-xl flex items-center justify-center mx-auto mb-3 text-emerald-400 text-lg">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">管理者登入</h1>
                <p class="text-gray-400 text-xs mt-1">請輸入 Firebase Authentication 帳號密碼</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">管理者 Email</label>
                    <input type="email" id="login-email" required placeholder="admin@example.com" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">密碼</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button type="submit" id="login-btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-sm transition shadow-md">登入後台</button>
            </form>
        </div>

        <!-- Dashboard Content -->
        <div id="dashboard-section" class="hidden space-y-10">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-darkBorder">
                <div class="flex space-x-2">
                    <button onclick="switchTab('articles')" id="tab-articles-btn" class="px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white transition shadow">
                        <i class="fa-solid fa-newspaper mr-1.5"></i> 文章管理
                    </button>
                    <button onclick="switchTab('comments')" id="tab-comments-btn" class="px-4 py-2 rounded-lg text-sm font-medium bg-darkCard text-gray-400 hover:text-white border border-darkBorder transition">
                        <i class="fa-solid fa-comments mr-1.5"></i> 留言審核
                    </button>
                </div>
                <button onclick="openArticleModal()" id="new-article-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-sm transition flex items-center space-x-2 shadow">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>新增文章</span>
                </button>
            </div>

            <!-- Articles Tab Panel -->
            <div id="panel-articles" class="space-y-4">
                <div class="bg-darkCard border border-darkBorder rounded-2xl overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-darkBorder bg-darkBg/50 text-xs text-gray-400 uppercase tracking-wider">
                                    <th class="p-4">標題 / 摘要</th>
                                    <th class="p-4">標籤</th>
                                    <th class="p-4">狀態</th>
                                    <th class="p-4">建立日期</th>
                                    <th class="p-4 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="admin-articles-list" class="divide-y divide-darkBorder text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Comments Tab Panel -->
            <div id="panel-comments" class="hidden space-y-4">
                <div class="bg-darkCard border border-darkBorder rounded-2xl overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-darkBorder bg-darkBg/50 text-xs text-gray-400 uppercase tracking-wider">
                                    <th class="p-4">留言者</th>
                                    <th class="p-4">內容</th>
                                    <th class="p-4">狀態</th>
                                    <th class="p-4">時間</th>
                                    <th class="p-4 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="admin-comments-list" class="divide-y divide-darkBorder text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Article Editor Modal -->
    <div id="article-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-darkCard border border-darkBorder rounded-2xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl relative my-8">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-darkBorder">
                <h3 id="article-modal-title" class="text-xl font-bold text-white">新增文章</h3>
                <button onclick="closeArticleModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="article-form" class="space-y-4">
                <input type="hidden" id="art-edit-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">文章標題</label>
                        <input type="text" id="form-title" required placeholder="例如：深入解析 Firestore 架構" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">網址代稱 (Slug)</label>
                        <input type="text" id="form-slug" required placeholder="例如：firestore-deep-dive" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">文章摘要 (Summary)</label>
                    <textarea id="form-summary" rows="2" required placeholder="簡短描述文章重點..." class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-emerald-500 transition"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">標籤 (Tags, 請用半形逗號分隔)</label>
                    <input type="text" id="form-tags" placeholder="Firebase, JavaScript, Cloud" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">完整內容 (支援 Markdown)</label>
                    <textarea id="form-content" rows="10" required placeholder="# 標題..." class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-gray-100 font-mono focus:outline-none focus:border-emerald-500 transition"></textarea>
                </div>
                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="form-published" class="w-4 h-4 rounded bg-darkBg border-darkBorder text-emerald-600 focus:ring-0">
                    <label for="form-published" class="text-sm text-gray-300">立即發佈 (Published)</label>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-darkBorder">
                    <button type="button" onclick="closeArticleModal()" class="px-4 py-2 bg-darkBg hover:bg-darkBorder text-gray-300 rounded-lg text-sm font-medium transition">取消</button>
                    <button type="submit" id="save-article-btn" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-medium transition shadow">儲存文章</button>
                </div>
            </form>
        </div>
    </div>

    <div id="app-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-darkCard border border-darkBorder rounded-xl max-w-md w-full p-6 shadow-2xl relative">
            <h3 id="modal-title" class="text-lg font-bold text-white mb-2">提示訊息</h3>
            <p id="modal-message" class="text-gray-300 text-sm mb-6"></p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-medium transition">確定</button>
            </div>
        </div>
    </div>

    <script>
        function showModal(title, message) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('app-modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('app-modal').classList.add('hidden');
        }
        function switchTab(tab) {
            if (tab === 'articles') {
                document.getElementById('panel-articles').classList.remove('hidden');
                document.getElementById('panel-comments').classList.add('hidden');
                document.getElementById('tab-articles-btn').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white transition shadow';
                document.getElementById('tab-comments-btn').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-darkCard text-gray-400 hover:text-white border border-darkBorder transition';
                document.getElementById('new-article-btn').classList.remove('hidden');
            } else {
                document.getElementById('panel-articles').classList.add('hidden');
                document.getElementById('panel-comments').classList.remove('hidden');
                document.getElementById('tab-comments-btn').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white transition shadow';
                document.getElementById('tab-articles-btn').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-darkCard text-gray-400 hover:text-white border border-darkBorder transition';
                document.getElementById('new-article-btn').classList.add('hidden');
            }
        }
    </script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>

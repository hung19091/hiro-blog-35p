name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HIRO_BLOG_35P }}
      SITE_URL: ${{ vars.SITE_URL }}
      ARTICLE_URL_FORMAT: query
      SITEMAP_OUTPUT_DIR: public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare Pages output
        run: |
          mkdir -p public
          cp index.html public/
          cp article.html public/
          cp admin.html public/
          cp robots.txt public/
          cp -r css public/css
          cp -r js public/js
          if [ -d doc ]; then cp -r doc public/doc; fi
          printf '\nSitemap: %s/sitemap.xml\n' "$SITE_URL" >> public/robots.txt

      - name: Generate sitemap.xml from Firestore
        run: npm run generate:sitemap

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4